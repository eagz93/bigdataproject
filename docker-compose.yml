
services:

  spark_etl:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: starbucks-spark-etl:latest
    container_name: starbucks-spark-etl

    volumes:
      - type: volume
        source: data_compartida
        target: /app/data

      - type: bind
        source: ./source_data
        target: /app/source_data
        read_only: true

    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      TZ: "America/Costa_Rica"
      PIPELINE_RUN_ON_STARTUP: "${PIPELINE_RUN_ON_STARTUP:-auto}"
      SPARK_DRIVER_MEM: "2g"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /app/data/plan_reabastecimiento_csv/_SUCCESS"]
      interval: 60s
      timeout: 10s
      retries: 20
      start_period: 1200s

    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G
        reservations:
          cpus: "1.0"
          memory: 2G

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: starbucks-plan-compras:latest
    container_name: starbucks-plan-compras

    depends_on:
      spark_etl:
        condition: service_started

    ports:
      - "127.0.0.1:8501:8501"

    volumes:
      - type: volume
        source: data_compartida
        target: /app/data

      - type: volume
        source: movimientos_data
        target: /app/data/movimientos

      - type: bind
        source: ./.streamlit/users.local.toml
        target: /app/.streamlit/secrets.toml
        read_only: true
        bind:
          create_host_path: false
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      TZ: "America/Costa_Rica"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

volumes:
  data_compartida:
    driver: local
    labels:
      com.project.description: "Salidas del pipeline Spark (plan, segmentos, parquet)"

  movimientos_data:
    driver: local
    labels:
      com.project.description: "Consumos y recepciones registrados en la app Streamlit"
